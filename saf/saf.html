<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SAF — VVFHAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c03900;
      --bg: #ffffff; --bg2: #f4f4f4; --bg3: #ebebeb;
      --border: #ddd; --text: #1a1a1a; --text-muted: #555; --text-faint: #999;
    }
    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      max-width: 420px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: var(--bg2);
      color: var(--red);
      font-size: 20px;
      text-decoration: none;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .back-btn:active, .back-btn:hover { background: #ffe8e0; border-color: var(--red); }
    .header-info { flex: 1; }
    .page-icon { font-size: 20px; line-height: 1; margin-bottom: 2px; }
    .page-title {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      margin-top: 3px;
    }
    .header-badge {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--red);
      border: 1px solid rgba(192,57,0,0.4);
      border-radius: 4px;
      padding: 3px 7px;
      font-family: 'Oswald', sans-serif;
    }

    /* ── contenuto ── */
    .content {
      flex: 1;
      padding: 20px 18px 32px;
    }

    /* ── placeholder ── */
    .placeholder-card {
      background: var(--bg2);
      border: 1px dashed #ccc;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .placeholder-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
    .placeholder-title {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .placeholder-text {
      font-size: 15px;
      color: var(--text-faint);
      line-height: 1.5;
    }

    /* ── card info (per quando aggiungerai contenuti) ── */
    .info-card {
      background: var(--bg2);
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .info-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--red);
      opacity: 0.7;
    }
    .card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-bottom: 6px;
    }
    .card-body {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* ── section label ── */
    .section-label {
      font-size: 14px;
      letter-spacing: 0.28em;
      color: var(--text-faint);
      text-transform: uppercase;
      font-weight: 600;
      margin: 0 0 12px;
      padding-left: 2px;
    }

    /* ── tag ── */
    .tag {
      display: inline-block;
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--red);
      border: 1px solid rgba(192,57,0,0.4);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'Oswald', sans-serif;
      margin-right: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="screen">

  <header class="page-header">
    <a href="../index.html" class="back-btn" aria-label="Torna alla home">‹</a>
    <div class="header-info">
      <div class="page-icon">⛰</div>
      <div class="page-title">SAF</div>
      <div class="page-subtitle">Speleo · Alpino · Fluviale</div>
    </div>
    <div class="header-badge">VVFHAB</div>
  </header>

  <main class="content">

    <!-- ================================================
         AGGIUNGI QUI I TUOI CONTENUTI PER LA SEZIONE SAF
         
         Esempi di struttura disponibile:
         
         — Sezione con titolo:
         <p class="section-label">Nome sezione</p>
         
         — Card informativa:
         <div class="info-card">
           <div class="card-title">Titolo</div>
           <div class="card-body">Testo o elenco puntato...</div>
         </div>
         
         — Tag/etichette:
         <span class="tag">TAG</span>
         ================================================ -->

    <div class="placeholder-card">
      <div class="placeholder-icon">⛰</div>
      <div class="placeholder-title">Sezione SAF — In allestimento</div>
      <div class="placeholder-text">
        Questa sezione è pronta per accogliere i tuoi contenuti operativi.<br />
        Sostituisci questo blocco con le tue informazioni.
      </div>
    </div>

  </main>

</div>
</body>
</html>
