<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>GPS — TAS · VVFHAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c03900;
      --bg: #ffffff; --bg2: #f4f4f4; --bg3: #ebebeb;
      --border: #ddd; --text: #1a1a1a; --text-muted: #555; --text-faint: #999;
    }
    html, body { min-height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased; }
    .screen { max-width: 420px; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; }

    /* header */
    .page-header { display: flex; align-items: center; gap: 14px; padding: 16px 18px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
    .back-btn { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid #e0e0e0; background: var(--bg2); color: var(--red); font-size: 20px; text-decoration: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s; }
    .back-btn:active { background: #ffe8e0; border-color: var(--red); }
    .header-info { flex: 1; }
    .page-icon { font-size: 18px; line-height: 1; margin-bottom: 2px; }
    .page-title { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.08em; color: var(--red); line-height: 1; }
    .page-subtitle { font-size: 13px; color: var(--text-faint); letter-spacing: 0.06em; margin-top: 3px; }
    .header-badge { font-size: 11px; letter-spacing: 0.1em; color: var(--red); border: 1px solid rgba(192,57,0,0.4); border-radius: 4px; padding: 3px 7px; font-family: 'Oswald', sans-serif; }

    /* content */
    .content { flex: 1; padding: 24px 18px 40px; }
    .section-label { font-size: 14px; letter-spacing: 0.28em; color: var(--text-faint); text-transform: uppercase; font-weight: 600; margin: 0 0 14px; }

    /* device card / button */
    .device-btn {
      display: block;
      background: var(--bg2);
      border: 1px solid #e0e0e0;
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      margin-bottom: 14px;
    }
    .device-btn::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--red); opacity: 0.7;
    }
    .device-btn:active { border-color: var(--red); background: #ffe8e0; }

    .device-img-wrap {
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      min-height: 220px;
    }
    .device-img {
      max-width: 160px;
      max-height: 200px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      /* fallback while loading */
    }

    /* SVG fallback shown when img fails */
    .device-img-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #555;
      font-size: 15px;
      letter-spacing: 0.06em;
    }
    .device-img.error + .device-img-fallback { display: flex; }

    .device-info {
      padding: 16px 20px 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .device-name {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--red);
      line-height: 1.1;
    }
    .device-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }
    .device-arrow {
      font-size: 24px;
      color: var(--red);
      opacity: 0.6;
      flex-shrink: 0;
    }
    .device-tag {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--red);
      border: 1px solid rgba(192,57,0,0.4);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'Oswald', sans-serif;
      margin-top: 6px;
    }

    .placeholder-card {
      background: var(--bg2); border: 1px dashed #ccc;
      border-radius: 14px; padding: 28px 20px; text-align: center; margin-top: 12px;
    }
    .placeholder-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
    .placeholder-title { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--red); margin-bottom: 4px; }
    .placeholder-text { font-size: 14px; color: var(--text-faint); line-height: 1.5; }
  </style>
</head>
<body>
<div class="screen">

  <header class="page-header">
    <a href="tas.html" class="back-btn" aria-label="Torna a TAS">‹</a>
    <div class="header-info">
      <div class="page-icon">🧭</div>
      <div class="page-title">GPS</div>
      <div class="page-subtitle">Dispositivi e manuali operativi</div>
    </div>
    <div class="header-badge">TAS</div>
  </header>

  <main class="content">
    <p class="section-label">Dispositivi disponibili</p>

    <a href="https://drive.google.com/file/d/1-LsDurw8yp8X0PBgnOQ4fvYFKIf8KTkr/view?usp=sharing"
       target="_blank" rel="noopener" class="device-btn" aria-label="Apri manuale Garmin GPSMAP 66S">

      <div class="device-img-wrap">
        <img
          class="device-img"
          src="img/garmin66s.png"
          alt="Garmin GPSMAP 66S"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        />
        <!-- fallback SVG se l'immagine non carica -->
        <div class="device-img-fallback" style="display:none;">
          <svg width="80" height="120" viewBox="0 0 80 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="5" width="60" height="110" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
            <rect x="16" y="12" width="48" height="36" rx="3" fill="#1a3a2a"/>
            <circle cx="40" cy="78" r="10" fill="#333" stroke="#555" stroke-width="1"/>
            <rect x="20" y="95" width="14" height="8" rx="2" fill="#333"/>
            <rect x="46" y="95" width="14" height="8" rx="2" fill="#333"/>
            <rect x="20" y="107" width="14" height="8" rx="2" fill="#333"/>
            <rect x="46" y="107" width="14" height="8" rx="2" fill="#333"/>
            <text x="40" y="34" text-anchor="middle" fill="#3dba58" font-size="9" font-family="monospace">GPS</text>
          </svg>
          <span style="color:#555;font-size:11px;">GARMIN 66S</span>
        </div>
      </div>

      <div class="device-info">
        <div>
          <div class="device-name">GPS GARMIN 66S</div>
          <div class="device-sub">Manuale operativo — Google Drive</div>
          <div class="device-tag">📄 APRI MANUALE</div>
        </div>
        <div class="device-arrow">›</div>
      </div>
    </a>

    <div class="placeholder-card">
      <div class="placeholder-icon">🧭</div>
      <div class="placeholder-title">Altri dispositivi — In allestimento</div>
      <div class="placeholder-text">Aggiungi qui i prossimi dispositivi GPS.</div>
    </div>

  </main>
</div>
</body>
</html>
