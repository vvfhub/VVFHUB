<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NBCR — VVFHAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c03900;
      --red-glow: #c0390020;
      --bg: #090909;
      --bg2: #111111;
      --bg3: #181818;
      --border: #222222;
      --text: #ffffff;
      --text-muted: #888888;
      --text-faint: #444444;
    }
    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      max-width: 420px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--red);
      font-size: 20px;
      text-decoration: none;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .back-btn:active, .back-btn:hover { background: #160800; border-color: var(--red); }
    .header-info { flex: 1; }
    .page-icon { font-size: 20px; line-height: 1; margin-bottom: 2px; }
    .page-title {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
      line-height: 1;
    }
    .page-subtitle {
      font-size: 11px;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      margin-top: 3px;
    }
    .header-badge {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--red);
      border: 1px solid rgba(192,57,0,0.3);
      border-radius: 4px;
      padding: 3px 7px;
      font-family: 'Oswald', sans-serif;
    }

    /* ── contenuto ── */
    .content {
      flex: 1;
      padding: 20px 18px 32px;
    }

    /* ── placeholder ── */
    .placeholder-card {
      background: var(--bg2);
      border: 1px dashed #2a2a2a;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .placeholder-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    .placeholder-title {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .placeholder-text {
      font-size: 13px;
      color: var(--text-faint);
      line-height: 1.5;
    }

    /* ── card info (per quando aggiungerai contenuti) ── */
    .info-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .info-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--red);
      opacity: 0.7;
    }
    .card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #fff;
      margin-bottom: 6px;
    }
    .card-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* ── section label ── */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--text-faint);
      text-transform: uppercase;
      font-weight: 600;
      margin: 0 0 12px;
      padding-left: 2px;
    }

    /* ── tag ── */
    .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--red);
      border: 1px solid rgba(192,57,0,0.3);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'Oswald', sans-serif;
      margin-right: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="screen">

  <header class="page-header">
    <a href="../index.html" class="back-btn" aria-label="Torna alla home">‹</a>
    <div class="header-info">
      <div class="page-icon">☢</div>
      <div class="page-title">NBCR</div>
      <div class="page-subtitle">Nucleare · Biologico · Chimico · Radiologico</div>
    </div>
    <div class="header-badge">VVFHAB</div>
  </header>

  <main class="content">

    <p class="section-label">Procedure operative</p>

    <a href="catena_beta.html" class="info-card" style="display:block;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color 0.15s,background 0.15s;" onmouseenter="this.style.borderColor='#c03900';this.style.background='#160800'" onmouseleave="this.style.borderColor='';this.style.background=''">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:22px;margin-bottom:6px;">☢</div>
          <div class="card-title">Catena Beta</div>
          <div class="card-body">Misura attività Beta nell'aria — procedura passo passo e calcolo decadimento.</div>
          <div style="margin-top:8px;">
            <span class="tag">LUNEDÌ</span>
            <span class="tag">GIOVEDÌ</span>
          </div>
        </div>
        <div style="font-size:22px;color:#c03900;opacity:0.5;padding-left:12px;">›</div>
      </div>
    </a>

    <div class="placeholder-card" style="margin-top:12px;">
      <div class="placeholder-icon">☢</div>
      <div class="placeholder-title">Altre procedure — In allestimento</div>
      <div class="placeholder-text">
        Aggiungi qui le prossime procedure NBCR.
      </div>
    </div>

  </main>

</div>
</body>
</html>
